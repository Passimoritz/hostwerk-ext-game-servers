<g transform="translate(898 102) scale(2.85)"><g class="bbbob"><ellipse cx="32" cy="57" rx="17" ry="3.2" fill="#000" opacity=".35" class="bbshadow"/><path d="M10 21 L32 32 V54 L10 43 Z" fill="url(#bbl)"/><path d="M54 21 L32 32 V54 L54 43 Z" fill="#702a06"/><path d="M32 10 L54 21 L32 32 L10 21 Z" fill="url(#bbt)"/><path d="M10 21 L32 32 L54 21" fill="none" stroke="#f8c5aa" stroke-opacity=".55" stroke-width=".8" stroke-linejoin="round"/><path d="M32 32 V54" stroke="#000" stroke-opacity=".18" stroke-width=".8"/><g clip-path="url(#bbc)"><rect class="bbshine" x="-14" y="6" width="14" height="30" fill="url(#bbsh)" transform="skewX(-25)"/></g><g transform="translate(.5 .8)"><g transform="matrix(0.8250 0.4125 -0.8250 0.4125 32 11.100)" fill="none" stroke="#000" stroke-opacity=".28" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></g></g><g class="bbglow" transform="matrix(0.8250 0.4125 -0.8250 0.4125 32 11.100)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="10" y1="11" y2="11"/><line x1="8" x2="8" y1="9" y2="13"/><line x1="15" x2="15.01" y1="12" y2="12"/><line x1="18" x2="18.01" y1="10" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/></g></g></g>
</g>

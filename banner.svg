<g transform="translate(640 70) rotate(-4) scale(1.5)"><g class="f f2" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/></g></g>
<g class="k">
<rect x="882" y="92" width="216" height="216" rx="54" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
<g transform="translate(898 104) scale(2.85)"><ellipse class="bbsd" cx="32" cy="53" rx="18" ry="2.8" fill="#000" opacity=".32"/><g class="bbfl"><path d="M20 20h24c6 0 10 4 11 10l2 10c1 6-5 9-9 5l-5-5H21l-5 5c-4 4-10 1-9-5l2-10c1-6 5-10 11-10z" fill="url(#bbm)"/><path d="M20 20h24c6 0 10 4 11 10l2 10c1 6-5 9-9 5l-5-5H21l-5 5c-4 4-10 1-9-5l2-10c1-6 5-10 11-10z" fill="url(#bbh)"/><path d="M19 26v8M15 30h8" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle class="bbbl" cx="43" cy="27" r="2.6" fill="#ffe08a"/><circle class="bbbl" style="animation-delay:1.5s" cx="48" cy="32" r="2.6" fill="#7cf0ff"/><circle cx="38" cy="32" r="2.6" fill="#ff8fa3"/><circle cx="43" cy="37" r="2.6" fill="#9dff9b"/></g></g>
</g>
<g transform="translate(1040 74) scale(0.9)"><path class="s" style="animation-delay:0s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(1170 300) scale(0.6)"><path class="s" style="animation-delay:1.1s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(860 320) scale(0.5)"><path class="s" style="animation-delay:2.2s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g><g transform="translate(560 150) scale(0.45)"><path class="s" style="animation-delay:0.6s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#ffffff"/></g>
</svg>
